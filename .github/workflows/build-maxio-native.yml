name: Build MAXIO PHY module with fnnas kernel tree

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc flex bison libssl-dev libelf-dev gcc-aarch64-linux-gnu

      - name: Extract fnnas kernel headers
        run: |
          mkdir -p kh
          tar -xzf kernel-module/k1headers.tar.gz -C kh
          KHD=$PWD/kh/linux-headers-6.18.18.c951-trim
          echo "KHD=$KHD" >> $GITHUB_ENV
          ls -la $KHD | head
          cat $KHD/include/generated/utsrelease.h
          echo "--- Module.symvers 行数 ---"
          wc -l $KHD/Module.symvers
          chmod +x $KHD/scripts/mod/modpost $KHD/scripts/basic/fixdep

      - name: Build maxio.ko with fnnas headers
        run: |
          mkdir -p build
          cp kernel-module/maxio.c build/maxio.c
          printf "obj-m := maxio.o\n" > build/Makefile
          cd build
          make -C "$KHD" M="$PWD" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules
          ls -la maxio.ko

      - name: Verify
        run: |
          mkdir -p out
          cp build/maxio.ko out/maxio.ko
          echo "=== vermagic (应为 6.18.18.c951-trim) ==="
          strings out/maxio.ko | grep -m2 "^6\.18"
          echo "=== 是否有 __versions 段 ==="
          if strings out/maxio.ko | grep -q "__versions"; then echo "有"; else echo "无(或已内嵌)"; fi
          sha256sum out/maxio.ko | tee out/SHA256SUMS
          ls -la out/

      - name: Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: maxionative-${{ github.run_number }}
          name: MAXIO PHY module (native build) ${{ github.run_number }}
          files: out/*
