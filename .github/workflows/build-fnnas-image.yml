name: Build full FnNAS image (xck-nas)

on:
  workflow_dispatch:
    inputs:
      board:
        description: 目标设备 (SOCs on amlogic/rockchip/allwinner)
        required: false
        default: lyt-t68m
      kernel:
        description: 内核版本 (留空自动选最新, 例 6.12.105)
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装依赖（dtb 编译 + renas 打包）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            btrfs-progs dosfstools parted gdisk util-linux uuid-runtime \
            build-essential fakeroot pigz xz-utils zstd curl jq gawk git \
            device-tree-compiler bison flex libssl-dev bc \
            python3 python3-pip
          sudo pip3 install pyelftools
          uname -r

      - name: 编译融合 dtb
        run: |
          chmod +x build-dtb.sh
          ./build-dtb.sh

      - name: 运行完整打包 (renas + 注入融合dtb)
        run: |
          chmod +x scripts/build-fnnas.sh
          ./scripts/build-fnnas.sh "${{ inputs.board }}" "${{ inputs.kernel }}"

      - name: 校验并上传产物
        run: |
          ls -lah out/
          find out -name "*.img*" -exec sha256sum {} \; > sha256sums.txt
          cat sha256sums.txt

      - name: 上传完整固件产物
        uses: actions/upload-artifact@v4
        with:
          name: fnnas-fully-image-${GITHUB_RUN_ID}
          path: |
            out/
            sha256sums.txt
          retention-days: 7

      - name: 发布 Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/
            sha256sums.txt
          body: |
            LYT T68M (RK3568) 飞牛 fnOS 完整固件（自打包）

            基于 fnnas.com 官方 Arm64 基础镜像构建，融合子板支持：
            - SATA2 (sata@fc800000)
            - SDIO WiFi (AIC8800, sdmmc2 + sdio-pwrseq)
            - 按 need_to_disable_pcie2x1 策略禁用 pcie2x1 释放 combphy2

            串口 console=ttyS2,1500000。fdtfile=rockchip/rk3568-lyt-t68m.dtb。
