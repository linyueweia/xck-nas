name: Build full FnNAS image (xck-nas)

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: 官方 rockchip 基础镜像版本 (留空取最新, 例 1253 / 692)
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            util-linux xz-utils curl jq gawk coreutils \
            device-tree-compiler bison flex libssl-dev bc \
            python3 python3-pip
          sudo pip3 install pyelftools
          uname -r

      - name: 编译融合 dtb
        run: |
          chmod +x build-dtb.sh
          ./build-dtb.sh

      - name: 打包完整固件（官方基础镜像 + 注入融合dtb）
        run: |
          # 释放 dtb 编译产生的内核源码空间
          rm -rf kernel
          df -h . | tail -1
          chmod +x scripts/build-fnnas.sh
          ./scripts/build-fnnas.sh "${{ inputs.base_version }}"

      - name: 校验并上传产物
        run: |
          ls -lah out/
          find out -name "*.img*" -exec sha256sum {} \; > sha256sums.txt
          cat sha256sums.txt

      - name: 上传完整固件产物
        uses: actions/upload-artifact@v4
        with:
          name: fnnas-fully-image-${GITHUB_RUN_ID}
          path: |
            out/
            sha256sums.txt
          retention-days: 7

      - name: 发布 Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/
            sha256sums.txt
          body: |
            LYT T68M (RK3568) 飞牛 fnOS 完整固件（自打包）

            基于 fnnas.com 官方 rockchip Arm64 基础镜像构建，注入融合子板 dtb：
            - SATA2 (sata@fc800000)
            - SDIO WiFi (AIC8800, sdmmc2 + sdio-pwrseq)
            - 按 iStoreOS v2 策略禁用 pcie2x1 释放 combphy2

            串口 console=ttyS2,1500000。fdtfile=rockchip/rk3568-lyt-t68m.dtb。
