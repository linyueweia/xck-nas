name: Build K1 DTB (flyniu skeleton)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 dtc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler

      - name: 编译（自包含展开式 DTS，不需要内核源码）
        run: |
          set -x
          mkdir -p out
          dtc -I dts -O dtb -o out/rk3568-kickpi-k1.dtb dts/rk3568-kickpi-k1.dts
          ls -la out/

      - name: 验证产物
        run: |
          D=out/rk3568-kickpi-k1.dtb
          ls -la $D
          sha256sum $D | tee out/SHA256SUMS
          echo "=== clock-names（必须含 pclk_xpcs）==="
          strings $D | grep -o "stmmaceth.mac_clk_rx[^\\x00]*" | head -3
          echo "=== model ==="
          strings $D | grep -iE "kickpi|rk3568-kickpi" | head -3
          echo "=== 反编译确认 gmac 节点 ==="
          dtc -I dtb -O dts $D -o /tmp/check.dts
          grep -A2 "ethernet@fe" /tmp/check.dts | grep -E "clock-names|clock_in_out|phy-mode" | head -12

      - name: 发布
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: k1fix-${{ github.run_number }}
          name: K1 DTB fix (flyniu skeleton) ${{ github.run_number }}
          files: out/*
