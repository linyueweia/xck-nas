name: Build K1 DTB only (from linux-6.18.y)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dtb-k1:
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler bc flex bison libssl-dev

      - name: 克隆 unifreq/linux-6.18.y 内核
        run: |
          set -x
          git clone --depth 1 -b main https://github.com/unifreq/linux-6.18.y.git kernel 2>&1 | tail -3

      - name: 编译 K1 DTB（展开式 DTS，自包含，不依赖内核 label）
        run: |
          set -x
          D=kernel/arch/arm64/boot/dts/rockchip
          cp -v dts/rk3568-kickpi-k1.dts "$D/rk3568-kickpi-k1.dts"
          grep -q "rk3568-kickpi-k1.dtb" "$D/Makefile" || \
            echo 'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3568-kickpi-k1.dtb' >> "$D/Makefile"
          cd kernel
          make ARCH=arm64 defconfig 2>&1 | tail -2
          make ARCH=arm64 dtbs -j"$(nproc)" 2>&1 | tail -30
          ls -la arch/arm64/boot/dts/rockchip/rk3568-kickpi-k1.dtb

      - name: 收集并校验
        if: always()
        run: |
          mkdir -p out
          DTB=kernel/arch/arm64/boot/dts/rockchip/rk3568-kickpi-k1.dtb
          if [ -f "$DTB" ]; then
            cp "$DTB" out/rk3568-kickpi-k1.dtb
            sha256sum out/rk3568-kickpi-k1.dtb | tee out/SHA256SUMS
            ls -la out/
            echo "=== 关键字符串 ==="
            strings out/rk3568-kickpi-k1.dtb | grep -E "kickpi|rk3568|rgmii" | head -8
            echo "=== DTB magic ==="
            od -A x -t x1z -N 16 out/rk3568-kickpi-k1.dtb
          else
            echo "!! 未生成"; cd kernel && make ARCH=arm64 dtbs 2>&1 | grep -E "Error|error" | head -40
          fi

      - name: 发布 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: k1dtb-ok-${{ github.run_number }}
          name: K1 DTB 6.18 ${{ github.run_number }}
          files: out/*

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k1-dtb
          path: out/
