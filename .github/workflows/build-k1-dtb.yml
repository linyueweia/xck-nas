name: Build K1 DTB only (from linux-6.18.y)

on:
  workflow_dispatch:
  push:
    paths:
      - 'dts/kickpi-k1/**'
      - '.github/workflows/build-k1-dtb.yml'

permissions:
  contents: write

jobs:
  build-dtb-k1:
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler bc flex bison libssl-dev

      - name: 克隆 unifreq/linux-6.18.y 内核
        run: |
          set -x
          git clone --depth 1 -b main https://github.com/unifreq/linux-6.18.y.git kernel 2>&1 | tail -3
          ls kernel/arch/arm64/boot/dts/rockchip/ | grep -E "^rk3568" | head -5

      - name: 放入 K1 官方 DTS/DTSI（用 6.18 内核的 rk3568.dtsi）
        run: |
          set -x
          D=kernel/arch/arm64/boot/dts/rockchip
          echo "=== 仓库里的 K1 dts ==="
          ls -la dts/kickpi-k1/ 2>/dev/null || echo "(没有 dts/kickpi-k1 目录)"
          # 只复制 K1 特有的（不覆盖内核的 rk3568.dtsi / rk356x.dtsi / rk3568-pinctrl.dtsi / rockchip-pinconf.dtsi）
          for f in dts/kickpi-k1/*.dts dts/kickpi-k1/rk3568-kickpi-*.dtsi; do
            [ -f "$f" ] && cp -v "$f" "$D/" || true
          done
          echo "=== 放入后（K1 相关）==="
          ls -la "$D"/rk3568-kickpi-* 2>&1 | head -20
          # Makefile 加编译目标
          grep -q "rk3568-kickpi-k1-linux" "$D/Makefile" || \
            echo 'dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3568-kickpi-k1-linux.dtb' >> "$D/Makefile"
          tail -3 "$D/Makefile"

      - name: 编译 K1 DTB
        run: |
          set -x
          cd kernel
          make ARCH=arm64 defconfig 2>&1 | tail -2
          make ARCH=arm64 dtbs -j"$(nproc)" 2>&1 | tail -40
          echo "=== 产物 ==="
          ls -la arch/arm64/boot/dts/rockchip/rk3568-kickpi-k1*.dtb 2>&1

      - name: 收集产物
        if: always()
        run: |
          mkdir -p out
          DTB=kernel/arch/arm64/boot/dts/rockchip/rk3568-kickpi-k1-linux.dtb
          if [ -f "$DTB" ]; then
            cp "$DTB" out/rk3568-kickpi-k1.dtb
            ls -la out/
            sha256sum out/rk3568-kickpi-k1.dtb | tee out/SHA256SUMS
            strings out/rk3568-kickpi-k1.dtb | grep -E "kickpi|rk3568" | head -6
          else
            echo "!! DTB 未生成，重新跑获取完整报错"
            cd kernel && make ARCH=arm64 dtbs 2>&1 | grep -E "Error|error|warning" | head -60
          fi

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k1-dtb-6.18
          path: out/

      - name: 发布 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: k1dtb2-${{ github.run_number }}
          name: K1 DTB (6.18, official DTS) ${{ github.run_number }}
          files: out/*
