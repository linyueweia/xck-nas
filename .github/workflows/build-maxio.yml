name: Build MAXIO PHY module hybrid

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc flex bison libssl-dev libelf-dev gcc-aarch64-linux-gnu

      - name: Clone kernel 6.18 (provides host tools + include tree)
        run: git clone --depth 1 -b main https://github.com/unifreq/linux-6.18.y.git k

      - name: Prepare kernel tree
        run: |
          cd k
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)

      - name: Extract fnnas headers and OVERRIDE version+symvers
        run: |
          set -x
          mkdir -p kh
          tar -xzf kernel-module/k1headers.tar.gz -C kh
          KHD=$PWD/kh/linux-headers-6.18.18.c951-trim
          echo "--- 飞牛的版本标识 ---"
          cat $KHD/include/generated/utsrelease.h
          echo "--- 用飞牛的覆盖 ---"
          cp -f $KHD/Module.symvers k/Module.symvers
          cp -f $KHD/include/generated/utsrelease.h k/include/generated/utsrelease.h
          cp -f $KHD/include/config/auto.conf k/include/config/auto.conf 2>/dev/null || true
          cp -f $KHD/include/generated/autoconf.h k/include/generated/autoconf.h 2>/dev/null || true
          echo "--- 覆盖后 ---"
          cat k/include/generated/utsrelease.h
          grep -c . k/Module.symvers

      - name: Build maxio.ko
        run: |
          set -x
          mkdir -p build
          cp kernel-module/maxio.c build/maxio.c
          printf "obj-m := maxio.o\n" > build/Makefile
          cd build
          make -C ../k M="$PWD" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules KBUILD_MODPOST_WARN=1
          ls -la maxio.ko

      - name: Verify
        run: |
          mkdir -p out
          cp build/maxio.ko out/maxio.ko 2>/dev/null || true
          if [ -f out/maxio.ko ]; then
            echo "=== vermagic (须为 6.18.18.c951-trim) ==="
            strings out/maxio.ko | grep -m3 "^6\.18" || true
            echo "=== MAE0621A 驱动名 ==="
            strings out/maxio.ko | grep -m2 "MAE0621A" || true
            sha256sum out/maxio.ko | tee out/SHA256SUMS
          fi
          ls -la out/

      - name: Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: maxiohyb-${{ github.run_number }}
          name: MAXIO PHY module hybrid ${{ github.run_number }}
          files: out/*
