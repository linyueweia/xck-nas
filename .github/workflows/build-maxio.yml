name: Build MAXIO PHY module for fnOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc flex bison libssl-dev libelf-dev gcc-aarch64-linux-gnu

      - name: Clone kernel 6.18
        run: git clone --depth 1 -b main https://github.com/unifreq/linux-6.18.y.git kernel

      - name: Prepare kernel build
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)
          # 打开 PHYLIB / MDIO，让 modpost 能找到符号
          ./scripts/config -m PHYLIB -y MDIO_DEVICE -m MDIO_BUS >/dev/null 2>&1 || true
          ./scripts/config -e PHYLIB >/dev/null 2>&1 || true
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig >/dev/null 2>&1 || true
          grep -E "CONFIG_(PHYLIB|MDIO)" .config || true

      - name: Build maxio.ko
        run: |
          D=kernel/drivers/net/phy
          cp kernel-module/maxio.c $D/maxio.c
          printf "obj-m += maxio.o\n" >> $D/Makefile
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=drivers/net/phy modules KBUILD_MODPOST_WARN=1
          cd ..
          ls -la kernel/drivers/net/phy/maxio.ko

      - name: Patch vermagic
        run: |
          mkdir -p out
          cp kernel/drivers/net/phy/maxio.ko out/maxio.ko
          python3 patch_vermagic.py out/maxio.ko
          python3 -c "import sys; d=open('out/maxio.ko','rb').read(); i=d.find(b'vermagic='); print('vermagic:', d[i+9:d.find(b chr(0), i)].decode())" || true
          strings out/maxio.ko | grep -m3 "6\.18"
          sha256sum out/maxio.ko | tee out/SHA256SUMS
          ls -la out/

      - name: Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: maxio-${{ github.run_number }}
          name: MAXIO PHY module ${{ github.run_number }}
          files: out/*
