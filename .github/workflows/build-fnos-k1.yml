name: Build FnOS K1 Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build K1 fnOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq xz-utils kmod

      - name: Download Official FnOS Universal Base Image
        id: download
        run: |
          set -e
          REPO="linyueweia/fnnas-base-images"
          TAG="v1.0.0"
          API_URL="https://api.github.com/repos/$REPO/releases/tags/$TAG"
          RESPONSE=$(curl -sL "$API_URL")
          ASSET_URL=$(echo "$RESPONSE" | jq -r '
            .assets[] | select(.name | endswith(".img.gz")) | .browser_download_url
          ' | sort -V | tail -n 1)
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "❌ No .img.gz asset found"; exit 1
          fi
          FILENAME=$(basename "$ASSET_URL")
          echo "Downloading: $FILENAME"
          curl -L -o "$FILENAME" "$ASSET_URL"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Decompress base image
        run: |
          mkdir -p fnnas-arm64
          gunzip -c "${{ steps.download.outputs.filename }}" > fnnas-arm64/fnnas-arm64.img

      - name: Build K1 image
        id: build
        run: |
          export DEVICE=kickpi-k1
          export DEVICE_LABEL=KICKPI-K1
          export BUILD_NUM=${{ github.run_number }}
          mkdir -p build-logs
          bash buildfnos.sh &> "build-logs/kickpi-k1.log" || (
            cat "build-logs/kickpi-k1.log"
            exit 1
          )

      - name: Verify image (DTB + rootfs customizations)
        run: |
          set -e
          IMG=$(find out -name "*.img" | head -n1)
          echo "镜像: $IMG"
          LOOP=$(sudo losetup -fP --show "$IMG")
          echo "loop: $LOOP"
          mkdir -p /tmp/bm /tmp/rm
          sudo mount -o loop,ro "${LOOP}p1" /tmp/bm
          sudo mount -o loop,ro "${LOOP}p2" /tmp/rm
          echo "================ 引导层检查 (分区之外) ================"
          # idbloader @扇区64, u-boot @扇区16384
          IDB_SRC=$(sha256sum uboot/rk3568/kickpi-k1/idbloader.img 2>/dev/null | awk '{print $1}')
          UB_SRC=$(sha256sum uboot/rk3568/kickpi-k1/u-boot.itb 2>/dev/null | awk '{print $1}')
          IDB_N=$(stat -c%s uboot/rk3568/kickpi-k1/idbloader.img 2>/dev/null || echo 0)
          UB_N=$(stat -c%s uboot/rk3568/kickpi-k1/u-boot.itb 2>/dev/null || echo 0)
          IDB_IMG=$(dd if="$IMG" bs=512 skip=64 count=$(( (IDB_N + 511) / 512 )) 2>/dev/null | head -c "$IDB_N" | sha256sum | awk '{print $1}')
          UB_IMG=$(dd if="$IMG" bs=512 skip=16384 count=$(( (UB_N + 511) / 512 )) 2>/dev/null | head -c "$UB_N" | sha256sum | awk '{print $1}')
          echo "idbloader 源: $IDB_SRC"
          echo "idbloader 像: $IDB_IMG"
          [ "$IDB_SRC" = "$IDB_IMG" ] && echo "✅ idbloader@扇区64 一致" || { echo "❌ idbloader 不一致"; exit 1; }
          echo "u-boot    源: $UB_SRC"
          echo "u-boot    像: $UB_IMG"
          [ "$UB_SRC" = "$UB_IMG" ] && echo "✅ u-boot@扇区16384 一致" || { echo "❌ u-boot 不一致"; exit 1; }
          echo "================ DTB 检查 ================"
          SRC=$(sha256sum uboot/rk3568/kickpi-k1/rk3568-kickpi-k1.dtb | awk '{print $1}')
          ING=$(sha256sum /tmp/bm/dtb/rockchip/rk3568-kickpi-k1.dtb | awk '{print $1}')
          echo "source: $SRC"; echo "image : $ING"
          [ "$SRC" = "$ING" ] && echo "✅ DTB 一致" || { echo "❌ DTB 不一致"; exit 1; }
          echo "================ rootfs 定制检查 ================"
          K=/tmp/rm/lib/modules/6.18.18.c951-trim
          ok=1
          chk(){ if [ "$1" = "0" ]; then echo "   ✅ $2"; else echo "   ❌ $2"; ok=0; fi; }
          [ -f "$K/kernel/drivers/net/phy/maxio.ko" ]; chk $? "maxio.ko 已注入 ($(stat -c%s $K/kernel/drivers/net/phy/maxio.ko 2>/dev/null || echo 0) 字节)"
          [ -L /tmp/rm/sbin/modprobe ]; chk $? "kmod 软链 modprobe"
          [ -L /tmp/rm/sbin/depmod ]; chk $? "kmod 软链 depmod"
          grep -q '^maxio' /tmp/rm/etc/modules-load.d/20-maxio.conf; chk $? "20-maxio.conf"
          grep -q maxio "$K/modules.dep"; chk $? "modules.dep 含 maxio"
          grep -q maxio "$K/modules.alias"; chk $? "modules.alias 含 maxio 别名"
          [ -x /tmp/rm/usr/local/bin/k1-net-setup.sh ]; chk $? "k1-net-setup.sh"
          [ -L /tmp/rm/etc/systemd/system/multi-user.target.wants/k1-net-setup.service ]; chk $? "systemd 服务已启用"
          echo "================ modprobe 干跑验证 ================"
          if modprobe -d /tmp/rm -n --set-version=6.18.18.c951-trim maxio; then
            echo "   ✅ modprobe maxio 可解析"
          else
            echo "   ❌ modprobe maxio 失败"; ok=0
          fi
          echo "================ maxio.ko 关键属性 ================"
          modinfo /tmp/rm/lib/modules/6.18.18.c951-trim/kernel/drivers/net/phy/maxio.ko | grep -E "name|vermagic|depends"
          sudo umount /tmp/bm /tmp/rm || true
          sudo losetup -d "$LOOP" || true
          [ "$ok" = "1" ] || { echo "❌ 固件定制检查未通过"; exit 1; }
          echo "✅ 全部检查通过"

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log-kickpi-k1-${{ github.run_number }}
          path: build-logs/

      - name: Compress built image
        run: |
          mkdir -p out-compressed
          for f in out/*.img; do
            xz -T0 -z -9 -c "$f" > "out-compressed/$(basename "$f").xz"
          done

      - name: Generate SHA256
        run: |
          cd out-compressed
          sha256sum *.img.xz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: fnos_KICKPI-K1_${{ github.run_number }}
          files: out-compressed/*
          body: |
            🎉 KICKPI K1 (RK3568) fnOS 自定义镜像
            
            - 基镜像: 飞牛官方通用基镜像 (fnnas-base-images)
            - 设备树: rk3568-kickpi-k1.dtb
            - u-boot: K1 原厂 idbloader + u-boot (RKNS)
            - rootfs: 官方默认大小（未扩容）
