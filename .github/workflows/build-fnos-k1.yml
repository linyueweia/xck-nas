name: Build FnOS K1 Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build KICKPI K1 fnOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq xz-utils device-tree-compiler

      - name: Download Official FnOS Universal Base Image
        id: download
        run: |
          set -e
          REPO="linyueweia/fnnas-base-images"
          TAG="v1.0.0"
          API_URL="https://api.github.com/repos/$REPO/releases/tags/$TAG"
          RESPONSE=$(curl -sL "$API_URL")
          ASSET_URL=$(echo "$RESPONSE" | jq -r '
            .assets[] | select(.name | endswith(".img.gz")) | .browser_download_url
          ' | sort -V | tail -n 1)
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "❌ No .img.gz asset found in linyueweia/fnnas-base-images"
            exit 1
          fi
          FILENAME=$(basename "$ASSET_URL")
          echo "Downloading: $FILENAME"
          curl -L -o "$FILENAME" "$ASSET_URL"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Decompress base image
        run: |
          mkdir -p fnnas-arm64
          gunzip -c "${{ steps.download.outputs.filename }}" > fnnas-arm64/fnnas-arm64.img

      - name: Build K1 image
        id: build
        run: |
          export DEVICE=kickpi-k1
          export DEVICE_LABEL=KICKPI-K1
          export BUILD_NUM=${{ github.run_number }}
          mkdir -p build-logs
          bash buildfnos.sh &> "build-logs/kickpi-k1.log" || (
            cat "build-logs/kickpi-k1.log"
            exit 1
          )

      - name: Verify injected DTB
        run: |
          cat > /tmp/verify_dtb.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          IMG=$(find out -name "*.img" | head -n1)
          echo "=== 镜像: $IMG"
          BOOT_IMG="/tmp/bootpart.img"
          # boot 分区在 LBA 65536 = 32MiB 偏移，大小 360MiB（GPT 分区 1）
          dd if="$IMG" of="$BOOT_IMG" bs=1M skip=32 count=360 2>/dev/null
          mkdir -p /tmp/bm
          sudo mount -o loop,ro "$BOOT_IMG" /tmp/bm || { sudo mount -o loop "$BOOT_IMG" /tmp/bm; }

          SRC_SHA=$(sha256sum uboot/rk3568/kickpi-k1/rk3568-kickpi-k1.dtb | awk '{print $1}')
          ING_SHA=$(sha256sum /tmp/bm/dtb/rockchip/rk3568-kickpi-k1.dtb | awk '{print $1}')
          echo "=== source dtb: $SRC_SHA"
          echo "=== img    dtb: $ING_SHA"
          echo "=== fnEnv.txt ==="; cat /tmp/bm/fnEnv.txt 2>/dev/null || true
          if [ "$SRC_SHA" != "$ING_SHA" ]; then
            echo "❌ DTB 不一致"; sudo umount /tmp/bm 2>/dev/null || true; exit 1
          fi
          echo "✅ DTB 一致"

          # 校验 fnEnv.txt 里的 fdtfile 指向 K1
          grep -q 'fdtfile=rockchip/rk3568-kickpi-k1.dtb' /tmp/bm/fnEnv.txt \
            && echo "✅ fdtfile 指向 K1" || { echo "❌ fdtfile 未指向 K1"; sudo umount /tmp/bm 2>/dev/null || true; exit 1; }

          # 校验 dtb 内容（用 dtc 反编译，避免依赖 fdtget 可用性）
          dtc -I dtb -O dts /tmp/bm/dtb/rockchip/rk3568-kickpi-k1.dtb -o /tmp/k1.dts 2>/dev/null
          grep -q 'rockchip,rk3568-kickpi-k1' /tmp/k1.dts \
            && echo "✅ compatible 含 rk3568-kickpi-k1" || { echo "❌ compatible 不匹配"; sudo umount /tmp/bm 2>/dev/null || true; exit 1; }
          grep -q 'ethernet@fe2a0000' /tmp/k1.dts && grep -q 'ethernet@fe010000' /tmp/k1.dts \
            && echo "✅ 双千兆节点存在" || { echo "❌ 缺少网口节点"; sudo umount /tmp/bm 2>/dev/null || true; exit 1; }
          grep -q 'sata@fc000000' /tmp/k1.dts \
            && echo "✅ SATA0 节点存在" || { echo "❌ 缺少 sata0"; sudo umount /tmp/bm 2>/dev/null || true; exit 1; }

          sudo umount /tmp/bm 2>/dev/null || true
          SCRIPT
          chmod +x /tmp/verify_dtb.sh
          bash /tmp/verify_dtb.sh

      - name: Upload build log (private)
        uses: actions/upload-artifact@v4
        with:
          name: build-log-kickpi-k1-${{ github.run_number }}
          path: build-logs/

      - name: Compress built image
        run: |
          mkdir -p out-compressed
          for f in out/*.img; do
            xz -T0 -z -9 -c "$f" > "out-compressed/$(basename "$f").xz"
          done

      - name: Generate SHA256
        run: |
          cd out-compressed
          sha256sum *.img.xz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: fnos_KICKPI-K1_${{ github.run_number }}
          files: out-compressed/*
          body: |
            🎉 KICKPI K1 (RK3568) fnOS 自定义镜像

            - 基镜像: 飞牛官方通用基镜像 (linyueweia/fnnas-base-images v1.0.0)
            - 设备树: rk3568-kickpi-k1.dtb（KICKPI SDK6.1 官方设备树）
              - 双千兆 gmac0/gmac1（复位 RK_PD3 / RK_PA7，tx/rx 0x21/0x3c 与 0x2f/0x39）
              - SATA0 + combphy0_us
            - 引导层: 沿用基镜像自带（idbloader@扇区64 + u-boot.itb@扇区16384）
            - rootfs: 官方默认大小（未扩容）

            fdtfile=rockchip/rk3568-kickpi-k1.dtb
            串口 console=ttyS2,1500000

            ⚠️ 仅支持 eMMC/SD 存储，刷写前请备份数据
