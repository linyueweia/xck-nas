name: Build DTB only (xck-nas)

on:
  workflow_dispatch:
  push:
    paths:
      - 'dts/**'
      - 'build-dtb.sh'

permissions:
  contents: write

jobs:
  build-dtb:
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends device-tree-compiler

      - name: 编译完整 DTB（含 NPU/多媒体节点）
        run: |
          chmod +x build-dtb.sh
          ./build-dtb.sh

      - name: 校验 DTB 完整性（应含 NPU 节点）
        run: |
          test -f rk3568-lyt-t68m.dtb || { echo "!! 未找到 DTB"; exit 1; }
          sha256sum rk3568-lyt-t68m.dtb
          # 展开检查 NPU/多媒体节点是否在编译产物中
          dtc -I dtb -O dts rk3568-lyt-t68m.dtb -o /tmp/check.dts
          for node in "npu@fde40000" "npu-opp-table" "rkvdec@fdf80200" "rkvenc@fdf40000" "jpegd@fded0000" "iep@fdef0000" "mpp-srv"; do
            grep -q "$node" /tmp/check.dts && echo "OK: $node" || { echo "!! 缺少 $node"; exit 1; }
          done
          # 网口/子板校验
          for node in "ethernet@fe010000" "ethernet@fe2a0000" "sata@fc400000" "sata@fc800000" "sdmmc2"; do
            grep -q "$node" /tmp/check.dts && echo "OK: $node" || { echo "!! 缺少 $node"; exit 1; }
          done

      - name: 校验 NPU 配置（对齐安卓原厂 DTB，权威基线）
        run: |
          dtc -I dtb -O dts rk3568-lyt-t68m.dtb -o /tmp/check2.dts
          # NPU IOMMU 必须含 rockchip,rk3568-iommu（飞牛 6.18 内核 iommu 驱动唯一匹配项；安卓原厂的 iommu-v2 在飞牛内核无驱动匹配会导致 probe -22）
          awk '/iommu@fde4b000/,/};/' /tmp/check2.dts | grep -q "rockchip,rk3568-iommu" && echo "OK: iommu compatible(rk3568-iommu)" || { echo "!! iommu compatible 缺 rk3568-iommu"; exit 1; }
          # power-controller 必须无 power-domain@6（安卓原厂无 @6）
          if awk '/power-controller {/,/^\t\t};/' /tmp/check2.dts | grep -q "power-domain@6"; then echo "!! 仍有 power-domain@6"; exit 1; else echo "OK: 无 power-domain@6"; fi
          # npu/iommu 不得引用 power-domains=<&power 6>（避免悬空引用）
          awk '/npu@fde40000/,/};/' /tmp/check2.dts | grep -q "power-domains" && { echo "!! npu 仍有 power-domains"; exit 1; } || echo "OK: npu 无 power-domains"
          awk '/iommu@fde4b000/,/};/' /tmp/check2.dts | grep -q "power-domains" && { echo "!! iommu 仍有 power-domains"; exit 1; } || echo "OK: iommu 无 power-domains"
          # NPU OPP 表必须含完整 6 项 nvmem-cell-names
          awk '/npu-opp-table/,/phandle/' /tmp/check2.dts | grep -q "specification_serial_number" && echo "OK: npu nvmem-cells" || { echo "!! npu nvmem-cells 缺失"; exit 1; }
          # GPU 中断顺序必须为 gpu/mmu/job（SDK 血统）
          awk '/gpu@fde60000/,/};/' /tmp/check2.dts | grep -q 'interrupt-names = "gpu\\0mmu\\0job"' && echo "OK: gpu irq order" || { echo "!! gpu irq 顺序错误"; exit 1; }
          # GPU power-model 必须存在
          awk '/gpu@fde60000/,/};/' /tmp/check2.dts | grep -q "power-model" && echo "OK: gpu power-model" || { echo "!! gpu power-model 缺失"; exit 1; }
          # GPU OPP 表必须含完整 nvmem-cells
          awk '/opp-table-1/,/phandle/' /tmp/check2.dts | grep -q "specification_serial_number" && echo "OK: gpu nvmem-cells" || { echo "!! gpu nvmem-cells 缺失"; exit 1; }
          # 6 个校准 cell 全部存在（spec-serial/mbist-vmin/core-pvtm/remark-serial/gpu-opp-info/npu-opp-info）
          for cell in "specification-serial-number@7" "mbist-vmin@9" "core-pvtm@2a" "remark-spec-serial-number@56" "gpu-opp-info@3c" "npu-opp-info@42"; do
            grep -q "$cell" /tmp/check2.dts && echo "OK: $cell" || { echo "!! 缺少 $cell"; exit 1; }
          done
          echo "===== 全部校验通过（NPU 对齐安卓原厂） ====="

      - name: 生成并输出校验文件
        run: |
          sha256sum rk3568-lyt-t68m.dtb > sha256sums.txt
          cat sha256sums.txt

      - name: 上传 DTB 产物
        uses: actions/upload-artifact@v4
        with:
          name: rk3568-lyt-t68m-full-dtb
          path: |
            rk3568-lyt-t68m.dtb
            sha256sums.txt
          retention-days: 7

      - name: 发布 Release（仅标签推送时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rk3568-lyt-t68m.dtb
            sha256sums.txt
          body: |
            LYT T68M (RK3568) 完整设备树 DTB（仅 DTB，不含固件）

            本产物为完整展开式 DTB，包含：
            - 4 网口（gmac0/gmac1 双千兆 + 2×PCIe RTL8125 双2.5G）
            - NPU/多媒体集群（npu@fde40000 + rkvdec + rkvenc + jpegd + iep + mpp-srv）
            - SATA2 (sata@fc800000) + SDIO WiFi (AIC8800)
            - GPIO4_C5/C6 LED（state=红 / power=绿）

            构建：克隆 unifreq/linux-6.18.y（R5S 官方固件 6.18.18.c951-trim 同血统）→ make ARCH=arm64 dtbs（仅 DTB，不打包固件）。
            fdtfile=rockchip/rk3568-lyt-t68m.dtb。串口 console=ttyS2,1500000。