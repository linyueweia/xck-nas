name: Build FnOS T68M Image

on:
  push:
    paths:
      - 'buildfnos.sh'
      - 'assets/**'
      - 'tools/**'
      - '.github/workflows/build-fnos-t68m.yml'
  workflow_dispatch:
    inputs:
      base_image_tag:
        description: "基镜像 release tag；latest=自适应最新正式版（推荐）"
        required: false
        default: "latest"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build T68M fnOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq xz-utils device-tree-compiler

      - name: Fetch latest fnOS universal base image (自适应)
        id: download
        run: |
          set -e
          REPO="linyueweia/fnnas-base-images"
          TAG="${{ inputs.base_image_tag || 'latest' }}"
          ASSET="fnnas-official-arm64-image_rockchip.img.gz"
          if [[ "$TAG" == "latest" ]]; then
            # 自适应：取最新正式基镜像 release（排除 src-* 源档 / draft / prerelease）
            TAG="$(curl -sf https://api.github.com/repos/$REPO/releases \
              | jq -r '[.[] | select((.draft|not) and (.prerelease|not) and ((.tag_name|startswith("src-"))|not))][0].tag_name')"
            [[ -n "$TAG" && "$TAG" != "null" ]] || { echo "::error::拿不到 $REPO 的最新基镜像 tag"; exit 1; }
          fi
          echo "基镜像 tag = $TAG"
          mkdir -p base
          URL="https://github.com/$REPO/releases/download/${TAG}/${ASSET}"
          echo "  下载: $URL"
          curl -fL --retry 3 -o "base/$ASSET" "$URL"
          gzip -t "base/$ASSET"
          # 完整性双校验：release 随附 SHA256SUMS（gz + 解压后 raw 各一道）
          curl -fL --retry 3 -o base/SHA256SUMS "https://github.com/$REPO/releases/download/${TAG}/SHA256SUMS"
          grep " ${ASSET}$" base/SHA256SUMS | (cd base && sha256sum -c -)
          echo "  ✓ gz 校验通过（$TAG）"
          RAW_NAME="fnnas-official-arm64-image_rockchip.img"
          gunzip -c "base/$ASSET" > "base/$RAW_NAME"
          rm -f "base/$ASSET"
          RAW_LINE="$(grep " ${RAW_NAME}$" base/SHA256SUMS || true)"
          if [[ -n "$RAW_LINE" ]]; then
            echo "$RAW_LINE" | (cd base && sha256sum -c -) || { echo "::error::raw 与 SHA256SUMS 不符"; exit 1; }
            echo "  ✓ raw 校验通过"
          fi
          mv "base/$RAW_NAME" base/fnnas-base.img
          mkdir -p fnnas-arm64
          cp base/fnnas-base.img fnnas-arm64/fnnas-arm64.img
          echo "filename=$ASSET" >> "$GITHUB_OUTPUT"
          sudo parted -s fnnas-arm64/fnnas-arm64.img unit s print || true

      - name: Build T68M image
        id: build
        run: |
          export DEVICE=lyt-t68m
          export DEVICE_LABEL=LYT-T68M
          export BUILD_NUM=${{ github.run_number }}
          mkdir -p build-logs
          bash buildfnos.sh &> "build-logs/lyt-t68m.log" || (
            cat "build-logs/lyt-t68m.log"
            exit 1
          )

      - name: Verify injected DTB
        run: |
          cat > /tmp/verify_dtb.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          IMG=$(find out -name "*.img" | head -n1)
          # v1.1.0 起 boot 分区尺寸可变（380MiB），改用 losetup -P 直接挂 p1（自适应）
          LOOP=$(sudo losetup -fP --show "$IMG")
          mkdir -p /tmp/bm
          sudo mount "${LOOP}p1" /tmp/bm
          SRC_SHA=$(sha256sum uboot/rk3568/lyt-t68m/rk3568-lyt-t68m.dtb | awk '{print $1}')
          ING_SHA=$(sha256sum /tmp/bm/dtb/rockchip/rk3568-lyt-t68m.dtb | awk '{print $1}')
          echo "=== source dtb: $SRC_SHA"
          echo "=== img    dtb: $ING_SHA"
          echo "=== fnEnv.txt ==="
          cat /tmp/bm/fnEnv.txt 2>/dev/null || true
          # 2026-10-15 定案：CMA 必须 1G（256M 时 rknpu 339MB 请求必失败 → 闭源驱动整机挂死）
          if grep -q 'cma=256M' /tmp/bm/fnEnv.txt; then
            echo "✅ fnEnv cma=256M（对齐官方 R5S fnEnv）"
          else
            echo "❌ fnEnv 缺 cma=256M（官方 R5S 同款；改值前先对官方 fnEnv 取证）"
            sudo umount /tmp/bm 2>/dev/null || true
          sudo losetup -d "$LOOP" 2>/dev/null || true
            exit 1
          fi
          if [ "$SRC_SHA" = "$ING_SHA" ]; then
            echo "✅ DTB 一致"
          else
            echo "❌ DTB 不一致"
            sudo umount /tmp/bm 2>/dev/null || true
            exit 1
          fi
          sudo umount /tmp/bm 2>/dev/null || true
          SCRIPT
          chmod +x /tmp/verify_dtb.sh
          bash /tmp/verify_dtb.sh

      - name: Media DT gate (转码死机防回归 · 官方形态对照)
        run: |
          chmod +x tools/verify-t68m-media-dts.sh
          # 镜像实际烧入的是 uboot/ 这份拷贝（buildfnos.sh 从 $UBOOT_PATH/*.dtb 写入 boot 分区）
          bash tools/verify-t68m-media-dts.sh uboot/rk3568/lyt-t68m/rk3568-lyt-t68m.dtb

      - name: R5S 字节级对标门禁（媒体簇 26 节点 vs 官方参照件，2026-10-27）
        run: |
          python3 tools/r5s-media-parity.py uboot/rk3568/lyt-t68m/rk3568-lyt-t68m.dtb dist/rk3568-nanopi-r5s-official.dtb

      - name: Upload build log (private)
        uses: actions/upload-artifact@v4
        with:
          name: build-log-lyt-t68m-${{ github.run_number }}
          path: build-logs/

      - name: Compress built image
        run: |
          mkdir -p out-compressed
          for f in out/*.img; do
            xz -T0 -z -9 -c "$f" > "out-compressed/$(basename "$f").xz"
          done

      - name: Generate SHA256
        run: |
          cd out-compressed
          sha256sum *.img.xz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: fnos_LYT-T68M_${{ github.run_number }}
          files: out-compressed/*
          body: |
            🎉 LYT-T68M (RK3568) fnOS 自定义镜像
            
            - 基镜像: 飞牛官方通用基镜像 (fnnas-base-images)
            - 设备树: rk3568-lyt-t68m.dtb (NPU 修复最终版)
            - u-boot: rk3568 idbloader + u-boot.itb
            - rootfs: 官方默认大小（未扩容）
            
            ⚠️ 仅支持 eMMC/SD 存储，刷写前请备份数据